load_module modules/ngx_http_js_module.so;

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    js_engine qjs;
    js_path /web;
    js_import auth from /web/auth.js;
    js_import listing from /web/listing.js;

    # Files are sandboxed, so a planted page cannot run script; the listing is not, as Chrome blocks
    # downloads started from a sandboxed page. ?download=1 saves a file instead of opening it.
    map $uri $csp {
        ~/$ "default-src 'none'";
        default "sandbox; default-src 'none'; style-src 'unsafe-inline'";
    }
    map $arg_download $disposition {
        "" "";
        default attachment;
    }

    # In-memory state; a restart clears it. fails: counted within 15 minutes of the last failure;
    # blocked: 1 hour; logins: kept past the 15 minute login so a stale header is not a new guess;
    # used: TOTP counters, valid for three 30 s steps.
    js_shared_dict_zone zone=fails:1m timeout=15m type=number evict;
    js_shared_dict_zone zone=blocked:1m timeout=1h type=number evict;
    js_shared_dict_zone zone=logins:1m timeout=24h type=number evict;
    js_shared_dict_zone zone=used:1m timeout=2m type=number evict;

    limit_req_zone $binary_remote_addr zone=perip:1m rate=10r/s;

    # Exactly one trusted hop: the last X-Forwarded-For entry, the one the proxy in front added.
    # Safe only because nothing but that proxy can reach this port (README, Web).
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    server {
        listen 8080;
        root /shared;
        # The proxy in front decides the scheme and port; a relative Location works through any of them.
        absolute_redirect off;
        limit_req zone=perip burst=20 nodelay;

        add_header Content-Security-Policy $csp always;
        add_header Content-Disposition $disposition always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;

        location / {
            limit_except GET {
                deny all;
            }
            js_access auth.check;
            disable_symlinks on;
        }

        location ~ /$ {
            limit_except GET {
                deny all;
            }
            js_access auth.check;
            js_content listing.render;
        }
    }
}
