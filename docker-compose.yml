services:
  cubby:
    build: .
    container_name: cubby
    hostname: cubby
    init: true
    ports:
      - "2222:22"
    volumes:
      - ./config:/config
      - ./shared:/shared
      - ./keys:/pubkeys:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
