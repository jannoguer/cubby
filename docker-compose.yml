x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  cubby:
    build: .
    container_name: cubby
    hostname: cubby
    init: true
    ports:
      - "${CUBBY_BIND_ADDR:-0.0.0.0}:2222:22"
    volumes:
      - ./config:/config
      - ./shared:/shared
      - ./keys:/pubkeys:ro
    read_only: true
    tmpfs:
      - /run:size=16m
      - /tmp:size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # entrypoint: home and /shared ownership
      - DAC_OVERRIDE     # entrypoint: read host-owned key files, chmod mounts
      - FOWNER           # entrypoint: chmod on host-owned bind mounts
      - KILL             # sshd: signal its unprivileged children
      - NET_BIND_SERVICE # sshd: bind port 22
      - SETGID           # sshd: drop to syncuser and the privsep user
      - SETUID
      - SYS_CHROOT       # sshd: privilege separation chroot
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Raise if the Mutagen agent gets killed while scanning a very large tree.
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 22 </dev/null | grep -q '^SSH-'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Never mounted into cubby: a client key cannot reach the snapshots.
  backup:
    build: ./backup
    container_name: cubby-backup
    init: true
    environment:
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-3600}"
      BACKUP_KEEP: "${BACKUP_KEEP:-168}"
    volumes:
      - ./shared:/shared:ro
      - ./backups:/backups
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    logging: *logging
    healthcheck:
      test: ["CMD", "/backup.sh", "check"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 10m
    restart: unless-stopped
